# Sistema de propostas (white label)
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Página de divulgação (site de venda) no endereço principal
[[redirects]]
  from = "/"
  to = "/inicio.html"
  status = 200
  force = true

# Links do cliente e painel
[[redirects]]
  from = "/p/*"
  to = "/proposta.html"
  status = 200

[[redirects]]
  from = "/c/*"
  to = "/contrato.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Login das contas (empresas e consultores) e login exclusivo do dono do sistema
[[redirects]]
  from = "/entrar"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/dono"
  to = "/admin.html"
  status = 200

# Propostas e contratos não devem aparecer no Google.
# Segurança: só scripts do próprio site (e o leitor de PDF do cdnjs, usado ao enviar o contrato em PDF),
# nenhuma página pode ser aberta dentro de outro site, HTTPS obrigatório e sem acesso a câmera, microfone e localização.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://viacep.com.br https://cdnjs.cloudflare.com; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'none'; object-src 'none'"

# Scripts e estilos sempre conferem a versão nova no servidor
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# Páginas (painel, proposta e contrato) sempre buscam a versão mais nova
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/entrar"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/dono"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/c/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
